sysstate:
    time:      "Float64"                # time since start of simulation [s]
    t_sim:     "Float64"                # time needed for one simulation timestep [s]
    sys_state: "Int16"                  # state of system state control
    cycle:     "Int16"                  # cycle number
    fig_8:     "Int16"                  # number of the figure of eight of the current cycle
    e_mech: "Float64"                   # mechanical energy [Wh]
    Qw: "MVector{O, MyFloat}"           # KA quaternion w-component, one per wing then body (frame 1 = kite)
    Qx: "MVector{O, MyFloat}"           # KA quaternion x-component, one per wing then body
    Qy: "MVector{O, MyFloat}"           # KA quaternion y-component, one per wing then body
    Qz: "MVector{O, MyFloat}"           # KA quaternion z-component, one per wing then body
    turn_rates: "MVector{3, MyFloat}"   # turn rates around the KA body x, y and z axis [rad/s]
    elevation: "MyFloat"                # elevation angle [rad]
    azimuth: "MyFloat"                  # azimuth angle in wind reference frame [rad]
    azimuth_rate: "MyFloat"             # azimuth rate [rad/s]
    l_tether: "MVector{T, MyFloat}"     # tether length, one per tether [m]
    v_reelout: "MVector{W, MyFloat}"    # reelout speed, one per winch [m/s]
    winch_force: "MVector{W, MyFloat}"  # tether force at the winch, one per winch [N]
    depower: "MyFloat"                  # depower settings [0..1]
    steering: "MyFloat"                 # actual steering [-1..1]
    kcu_steering: "MyFloat"             # steering after the kcu, before applying offset and depower scaling [-1..1]
    set_steering: "MyFloat"             # set value of the steering [-1..1]
    heading: "MyFloat"                  # heading angle [rad]
    heading_rate: "MyFloat"             # heading rate [rad/s]
                                        # add heading_turn_rate, course_rate and course_turn_rate
    course: "MyFloat"                   # course angle [rad]
    bearing: "MyFloat"                  # bearing angle (set value of heading/ course) [rad]
    attractor: "MVector{2, MyFloat}"    # attractor coordinates (azimuth, elevation) [rad]
    v_app: "MyFloat"                    # norm of apparent wind speed [m/s]
    v_wind_gnd: "MVector{3, MyFloat}"   # wind vector at reference height [m/s]
    v_wind_200m: "MVector{3, MyFloat}"  # wind vector at 200m height [m/s]
    v_wind_kite: "MVector{3, MyFloat}"  # wind vector at the height of the kite [m/s]
    AoA: "MyFloat"                      # angle of attack [rad]
    side_slip: "MyFloat"                # side slip angle [rad]
    alpha3: "MyFloat"                   # angle of attack at particle C [rad]
    alpha4: "MyFloat"                   # angle of attack at particle D [rad]
    CL2: "MyFloat"                      # lift coefficient
    CD2: "MyFloat"                      # drag coefficient
    aero_force_KA_x: "MVector{K, MyFloat}"  # aerodynamic force along KA x, one per wing [N]
    aero_force_KA_y: "MVector{K, MyFloat}"  # aerodynamic force along KA y, one per wing [N]
    aero_force_KA_z: "MVector{K, MyFloat}"  # aerodynamic force along KA z, one per wing [N]
    aero_moment_KA_x: "MVector{K, MyFloat}" # aerodynamic moment around KA x, one per wing [Nm]
    aero_moment_KA_y: "MVector{K, MyFloat}" # aerodynamic moment around KA y, one per wing [Nm]
    aero_moment_KA_z: "MVector{K, MyFloat}" # aerodynamic moment around KA z, one per wing [Nm]
    twist_angles: "MVector{D, MyFloat}" # twist angle, one per twist_surface [rad]
    vel_kite: "MVector{3, MyFloat}"     # velocity vector of the kite [m/s]
    acc: "MyFloat"                      # acceleration [m/s²]
    X: "MVector{P, MyFloat}"            # position in x; points first, the last O wings then bodies [m]
    Y: "MVector{P, MyFloat}"            # position in y; points first, the last O wings then bodies [m]
    Z: "MVector{P, MyFloat}"            # position in z; points first, the last O wings then bodies [m]
    flap_angle: "MVector{D, MyFloat}"   # flap deflection per aero segment, one per twist_surface [rad]
    VX: "MVector{P, MyFloat}"           # velocity in x; points first, the last O wings then bodies [m/s]
    VY: "MVector{P, MyFloat}"           # velocity in y; points first, the last O wings then bodies [m/s]
    VZ: "MVector{P, MyFloat}"           # velocity in z; points first, the last O wings then bodies [m/s]
    aero_force_x: "MVector{P, MyFloat}" # aerodynamic force on each point in x, ENU reference frame [N]
    aero_force_y: "MVector{P, MyFloat}" # aerodynamic force on each point in y, ENU reference frame [N]
    aero_force_z: "MVector{P, MyFloat}" # aerodynamic force on each point in z, ENU reference frame [N]
    drag_force_x: "MVector{P, MyFloat}" # drag force on each point in x, ENU reference frame [N]
    drag_force_y: "MVector{P, MyFloat}" # drag force on each point in y, ENU reference frame [N]
    drag_force_z: "MVector{P, MyFloat}" # drag force on each point in z, ENU reference frame [N]
    spring_force: "MVector{S, MyFloat}" # spring force, one per segment [N]
    gamma_distribution: "MVector{N, MyFloat}" # circulation, one per aerodynamic panel [m²/s]
    turn_rate_x: "MVector{O, MyFloat}"  # KA turn rate around x, one per wing then body [rad/s]
    turn_rate_y: "MVector{O, MyFloat}"  # KA turn rate around y, one per wing then body [rad/s]
    turn_rate_z: "MVector{O, MyFloat}"  # KA turn rate around z, one per wing then body [rad/s]
    twist_vel: "MVector{D, MyFloat}"    # twist rate, one per twist_surface [rad/s]
    pulley_len: "MVector{L, MyFloat}"   # length of the first leg of each pulley [m]
    pulley_vel: "MVector{L, MyFloat}"   # rate of change of pulley_len [m/s]
    set_torque: "MVector{W, MyFloat}"   # torque setting, one per winch [Nm]
    set_speed: "MVector{W, MyFloat}"    # speed setting, one per winch [m/s]
    set_force: "MVector{W, MyFloat}"    # force setting, one per winch [N]
    set_ext_force_x: "MVector{P, MyFloat}" # external force applied to each point in x, ENU reference frame [N]
    set_ext_force_y: "MVector{P, MyFloat}" # external force applied to each point in y, ENU reference frame [N]
    set_ext_force_z: "MVector{P, MyFloat}" # external force applied to each point in z, ENU reference frame [N]
    var_01: "MyFloat"                   # generic variable 01
    var_02: "MyFloat"                   # generic variable 02
    var_03: "MyFloat"                   # generic variable 03
    var_04: "MyFloat"                   # generic variable 04
    var_05: "MyFloat"                   # generic variable 05
    var_06: "MyFloat"                   # generic variable 06
    var_07: "MyFloat"                   # generic variable 07
    var_08: "MyFloat"                   # generic variable 08
    var_09: "MyFloat"                   # generic variable 09
    var_10: "MyFloat"                   # generic variable 10
    var_11: "MyFloat"                   # generic variable 11
    var_12: "MyFloat"                   # generic variable 12
    var_13: "MyFloat"                   # generic variable 13
    var_14: "MyFloat"                   # generic variable 14
    var_15: "MyFloat"                   # generic variable 15
    var_16: "MyFloat"                   # generic variable 16
